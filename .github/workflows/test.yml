name: Run tests

on:
  push:
    branches: [master, main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

defaults:
  run:
    # Windows runners default to PowerShell, but the "Configure git" and
    # "Install unregistered dependencies" steps below are bash (`$RUNNER_TEMP`,
    # `mkdir -p`, `DEPS=`). Force bash (Git Bash on Windows) on every platform
    # so those steps behave identically across the whole matrix.
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # A transient "Set up job" provisioning failure on the scarce Windows /
      # macOS hosted runners must not cancel the other cells: without this, one
      # flaky runner reds the whole matrix and discards the (passing) Linux +
      # other-OS results. Each cell now runs and reports independently.
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - os: macOS-latest
            julia-arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: |
          # Clone the unregistered deps OUTSIDE the checkout. TestItemRunner's
          # `@run_package_tests` scans the project root recursively, so deps
          # cloned as subdirs of the checkout would drag their OWN test suites
          # into this run (204 spurious errors from tests whose deps we don't
          # have). $RUNNER_TEMP is outside $GITHUB_WORKSPACE, so it is not
          # scanned.
          DEPS="$RUNNER_TEMP/aov-ci-deps"
          mkdir -p "$DEPS"
          # DynamicObjects on `pre-inference` (0.5.0): HTMXObjects@devibe
          # bounds DynamicObjects to 0.4.4+ (`1076bd8`), while the old
          # sbpmx-reflect line still stamps 0.4.3, so developing it is
          # unsatisfiable (registry max is 0.4.3 too). pre-inference is the
          # desktop's declared DO line and carries the fetchindex/PCE surface
          # devibe imports.
          git clone -b pre-inference https://github.com/nsiccha/DynamicObjects.jl.git "$DEPS/DynamicObjects.jl"
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git "$DEPS/HTMX.jl"
          git clone -b devibe https://github.com/nsiccha/HTMXObjects.jl.git "$DEPS/HTMXObjects.jl"
          git clone https://github.com/nsiccha/Treebars.jl.git "$DEPS/Treebars.jl"
          julia --project -e '
            # Julia 1.11+ (setup-julia "1"/"pre") rejects `Pkg.develop(path=...)`
            # for a package the active project already sources by url/rev
            # ("`path` and `url` are conflicting specifications"). Strip the
            # committed [sources] table from this throwaway CI checkout so the
            # path-develops below are the sole source. No-op on 1.10 ("lts"),
            # which ignores [sources] anyway.
            import TOML
            proj = Base.active_project()
            d = TOML.parsefile(proj)
            haskey(d, "sources") && delete!(d, "sources")
            open(proj, "w") do io; TOML.print(io, d); end
            using Pkg
            deps = ENV["RUNNER_TEMP"] * "/aov-ci-deps"
            Pkg.develop([
              PackageSpec(path=joinpath(deps, "DynamicObjects.jl")),
              PackageSpec(path=joinpath(deps, "HTMX.jl")),
              PackageSpec(path=joinpath(deps, "HTMXObjects.jl")),
              PackageSpec(path=joinpath(deps, "Treebars.jl")),
            ])
            Pkg.resolve()
          '
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install vl-convert
        run: |
          # `vsave` renders through the vl-convert CLI (test/vsave.jl). Pin the
          # release its test items were verified against, checksum included.
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   dist=linux-64;  sum=f557637a159c7510a1486e1e41a86c3919abd71c18abc0826b499c76c712aa53 ;;
            macOS-ARM64) dist=osx-arm64; sum=794a4182f3717a4730eb0dc8c08f290880a6a56c010f7335e32ceda7a1a3178e ;;
            Windows-X64) dist=win-64;    sum=97ddf99e7f57133367bcda75fba172acb59db5a65350f28feb2bf29a24cc8b07 ;;
            *) echo "no pinned vl-convert build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/vl-convert"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/vl-convert.zip" "https://github.com/vega/vl-convert/releases/download/v1.9.0/vl-convert_$dist.zip"
          # Hash stdin: given a path with a backslash (Windows' $RUNNER_TEMP),
          # sha256sum escapes it and prefixes the digest with `\`.
          if command -v sha256sum >/dev/null; then sha=sha256sum; else sha="shasum -a 256"; fi
          got=$($sha < "$dir/vl-convert.zip" | cut -d' ' -f1)
          [ "$got" = "$sum" ] || { echo "vl-convert_$dist.zip sha256 $got, expected $sum" >&2; exit 1; }
          unzip -q -o "$dir/vl-convert.zip" -d "$dir"
          echo "$dir/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          fail_ci_if_error: false
