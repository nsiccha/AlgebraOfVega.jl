name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write
  actions: write        # let julia-actions/cache evict its own caches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: cd docs && npm install
      - name: Install dependencies
        run: |
          # Resolve the public unregistered dependencies together, outside
          # the checkout so package discovery cannot scan their test suites.
          DEPS="$RUNNER_TEMP/aov-ci-deps"
          mkdir -p "$DEPS"
          git clone -b pre-inference https://github.com/nsiccha/DynamicObjects.jl.git "$DEPS/DynamicObjects.jl"
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git "$DEPS/HTMX.jl"
          git clone -b devibe https://github.com/nsiccha/HTMXObjects.jl.git "$DEPS/HTMXObjects.jl"
          git clone -b main https://github.com/nsiccha/Treebars.jl.git "$DEPS/Treebars.jl"
          julia --project=docs -e '
            # See test.yml: Julia 1.11+ rejects path-develop of a package the
            # active project already sources by url/rev. Strip [sources] from
            # this throwaway docs env so the path-develops are the sole source.
            import TOML
            proj = Base.active_project()
            d = TOML.parsefile(proj)
            haskey(d, "sources") && delete!(d, "sources")
            open(proj, "w") do io; TOML.print(io, d); end
            using Pkg
            deps = ENV["RUNNER_TEMP"] * "/aov-ci-deps"
            Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(path=joinpath(deps, "DynamicObjects.jl")),
              PackageSpec(path=joinpath(deps, "HTMX.jl")),
              PackageSpec(path=joinpath(deps, "HTMXObjects.jl")),
              PackageSpec(path=joinpath(deps, "Treebars.jl")),
            ])
            Pkg.instantiate()
          '
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
      - name: Verify deployed pages and assets
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        run: python3 docs/check_site.py --url https://nsiccha.github.io/AlgebraOfVega.jl/dev/ --revision "$GITHUB_SHA" --wait 600
